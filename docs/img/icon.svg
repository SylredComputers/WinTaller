<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F7AEC"/>
      <stop offset="1" stop-color="#0B3D91"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#F29A0B"/>
    </linearGradient>
    <mask id="boca">
      <rect x="-100" y="-120" width="200" height="240" fill="#fff"/>
      <rect x="-10" y="-90" width="20" height="34" fill="#000"/>
    </mask>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#001a4d" flood-opacity="0.40"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <!-- ventana -->
  <g filter="url(#sh)">
    <rect x="34" y="48" width="188" height="160" rx="18" fill="#FFFFFF"/>
    <path d="M34 66 a18 18 0 0 1 18 -18 h152 a18 18 0 0 1 18 18 v12 h-188 z" fill="#D6E6FD"/>
    <circle cx="56" cy="64" r="6" fill="#1F7AEC"/>
    <circle cx="75" cy="64" r="6" fill="#8DB9F7"/>
    <circle cx="94" cy="64" r="6" fill="#8DB9F7"/>
  </g>
  <!-- destornillador -->
  <g transform="translate(128 146) rotate(45)">
    <rect x="-5" y="-74" width="10" height="64" rx="2.5" fill="#163A70"/>
    <path d="M-5 -74 L0 -86 L5 -74 Z" fill="#163A70"/>
    <rect x="-14" y="-14" width="28" height="64" rx="12" fill="url(#amber)"/>
    <rect x="-6" y="-5" width="4" height="46" rx="2" fill="#FFFFFF" opacity="0.5"/>
  </g>
  <!-- llave -->
  <g transform="translate(128 146) rotate(-45)">
    <g mask="url(#boca)">
      <circle cx="0" cy="-58" r="25" fill="#163A70"/>
    </g>
    <rect x="-10" y="-44" width="20" height="98" rx="10" fill="#163A70"/>
    <circle cx="0" cy="42" r="5" fill="#FFFFFF" opacity="0.85"/>
  </g>
