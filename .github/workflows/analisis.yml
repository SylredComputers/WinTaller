# Revisión automática de WinTaller en cada cambio (auditoría de seguridad, H-09).
# No instala nada ni cambia el equipo: analiza el código y ejecuta la
# autocomprobación (-SelfTest), que solo lee información.
name: Análisis del código

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $errores = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\WinTaller.ps1), [ref]$tokens, [ref]$errores)
          if ($errores.Count -gt 0) {
            $errores | ForEach-Object { Write-Host ('::error file=WinTaller.ps1,line={0}::{1}' -f $_.Extent.StartLineNumber, $_.Message) }
            exit 1
          }
          Write-Host 'Sin errores de sintaxis.'

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $errores = @(Invoke-ScriptAnalyzer -Path .\WinTaller.ps1 -Severity Error)
          $avisos  = @(Invoke-ScriptAnalyzer -Path .\WinTaller.ps1 -Severity Warning)
          $resumen = $avisos | Group-Object RuleName | Sort-Object Count -Descending |
            ForEach-Object { '| {0} | {1} |' -f $_.Name, $_.Count }
          @('### PSScriptAnalyzer', '', ('Errores: {0} · Avisos: {1}' -f $errores.Count, $avisos.Count), '',
            '| Regla | Avisos |', '| --- | --- |') + $resumen | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          foreach ($e in $errores) {
            Write-Host ('::error file=WinTaller.ps1,line={0}::{1}: {2}' -f $e.Line, $e.RuleName, $e.Message)
          }
          if ($errores.Count -gt 0) { exit 1 }

      - name: Autocomprobación (-SelfTest)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\WinTaller.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
